name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Install Dependencies & Build Web Project
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Setup Capacitor
        run: |
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
          echo '{"appId":"com.frameforge.app","appName":"FrameForge","webDir":"dist"}' > capacitor.config.json
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
